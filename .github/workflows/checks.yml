name: CAD to Career checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check cloud.js
          node --check data.js
          node --check lesson-guides.js
      - name: Validate curriculum and application integrity
        run: |
          node scripts/build-public.mjs
          node --test tests/public-output.cjs
          node tests/smoke.cjs
          node --test tests/curriculum-integrity.cjs
          node --test tests/csp-compatibility.cjs
          node --test tests/expanded-curriculum.cjs
          node --test tests/lesson-guides.cjs
          node --test tests/geometry-feedback.cjs
          node --test tests/lab-accessibility.cjs
          node tests/cloud-sync.cjs


