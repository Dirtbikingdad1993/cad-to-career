name: CAD to Career Base44 Snapshot Checks
on:
  push:
    paths:
      - 'apps/base44-site/**'
      - '.github/workflows/base44-site-checks.yml'
  pull_request:
    paths:
      - 'apps/base44-site/**'
      - '.github/workflows/base44-site-checks.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/base44-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/base44-site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
